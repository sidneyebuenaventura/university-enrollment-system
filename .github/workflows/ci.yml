name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --only-dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: university
          POSTGRES_USER: university
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: university
          RABBITMQ_DEFAULT_PASS: password
          RABBITMQ_DEFAULT_VHOST: university
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.core
      SECRET_KEY: ci
      DATABASE_URL: postgres://university:password@localhost:5432/university
      CELERY_BROKER_URL: amqp://university:password@localhost:5672/university
      EVENT_BROKER_URL: amqp://university:password@localhost:5672/university

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest --cov --cov-report=term --cov-report=json

      # The badge reads coverage.json from the badges branch through shields.io
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          percent=$(jq '.totals.percent_covered | floor' coverage.json)
          color=red
          if [ "$percent" -ge 80 ]; then color=brightgreen
          elif [ "$percent" -ge 60 ]; then color=yellow
          fi

          cd "$(mktemp -d)"
          git init -q -b badges
          echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"${percent}%\", \"color\": \"${color}\"}" > coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update coverage badge"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t university .

      - name: Smoke test
        run: docker run --rm university python -c "import django; print(django.get_version())"
